name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela una ejecución anterior de la misma rama/PR cuando llega un push nuevo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: test · lint · typecheck · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall copia los binarios WASM de MediaPipe a public/; no hace
      # falta red aparte, vienen con el propio paquete.
      - run: npm ci

      - run: npm test

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Modelos reales en public/mediapipe/models/, no el bucket de Google:
      # ver el comentario en playwright.config.ts sobre por qué un intento de
      # carga que nunca resuelve es peor que depender de esta descarga.
      - run: npm run fetch:models

      - run: npm run test:e2e

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
